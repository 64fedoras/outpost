name: Lab

# Runs on the home network, NOT on GitHub. A Gitea instance on the LAN holds a pull mirror of
# this repository and an Actions runner (label lab-runner) picks these jobs up. Gitea also lists
# the .github/workflows/ files of the mirror; they ask for ubuntu-24.04 runners, which the lab
# runner does not have, so they only queue. Do not give the lab runner that label. Nothing here
# triggers on a push or a pull request: this job talks to the real cluster, so it starts only by
# hand (Run workflow) or on the nightly schedule.
#
# Secrets (the mirror's Settings, Actions, Secrets; never in the repository):
#   OUTPOST_LAB_URL          controller address, e.g. https://192.0.2.10:8443
#   OUTPOST_LAB_TOKEN        an API token from the controller's Settings, API tokens
#   OUTPOST_LAB_FINGERPRINT  optional: the controller certificate's SHA-256 (Settings shows it)
# See testing/README.md, "Lab checks".
on:
  workflow_dispatch:
    inputs:
      stages:
        description: "Stages: smoke, inspect (read-only); add update to restart one node three times"
        default: "smoke,inspect"
      update_node:
        description: "For the update stage: name of the spare node to update, roll back and update again"
        default: ""
  schedule:
    - cron: "30 8 * * *"

jobs:
  smoke:
    runs-on: lab-runner
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Smoke checks against the real cluster
        env:
          OUTPOST_LAB_URL: ${{ secrets.OUTPOST_LAB_URL }}
          OUTPOST_LAB_TOKEN: ${{ secrets.OUTPOST_LAB_TOKEN }}
          OUTPOST_LAB_FINGERPRINT: ${{ secrets.OUTPOST_LAB_FINGERPRINT }}
          # Scheduled runs have no inputs, so they fall back to the read-only default.
          OUTPOST_LAB_STAGES: ${{ github.event.inputs.stages || 'smoke,inspect' }}
          OUTPOST_LAB_UPDATE_NODE: ${{ github.event.inputs.update_node }}
        run: python3 testing/lab_smoke.py
