name: Build binaries

# Builds the five platform binaries after every merge to main (and on demand) and publishes them
# as release v<version>. No workflow artifact is uploaded: the release holds the binaries, and
# artifacts only filled the Actions storage quota.
# Every push gets the next patch version (see .github/next-version.sh), stamped into the build
# workspace only; nothing is committed back, so there is no push loop and no merge conflict.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One build at a time per branch, so two quick merges cannot race to create the same release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Install llvm (for Windows version info)
        run: sudo apt-get update && sudo apt-get install -y llvm
      - name: Stamp version
        id: ver
        run: |
          V=$(sh .github/next-version.sh)
          sed -i "s/^const Version = \".*\"/const Version = \"$V\"/" cmd/outpost/proto.go
          echo "OUTPOST_VERSION=$V" >> "$GITHUB_ENV"
          echo "Building Outpost $V"
      - name: Vet and test
        run: go vet ./... && go test ./...
      - name: Build
        id: build
        run: |
          V=$OUTPOST_VERSION
          echo "version=$V" >> "$GITHUB_OUTPUT"
          sh build.sh "$PWD/dist/outpost-$V"
          cp README.md LICENSE THIRD_PARTY_NOTICES.txt "dist/outpost-$V/"
          # The model catalog, so older controllers can pick up new suggested models (catalog_remote.go).
          ./dist/outpost-$V/bin/outpost-linux-amd64 catalog-json > "dist/outpost-$V/bin/catalog.json"
          (cd dist && zip -qr "outpost-$V.zip" "outpost-$V")
          (cd "dist/outpost-$V/bin" && sha256sum * > SHA256SUMS)
          # The stamped binary must report the stamped version, and the updater must be able to read it.
          ./dist/outpost-$V/bin/outpost-linux-amd64 version | grep -F "$V"
          grep -aF "OUTPOST_BUILD_INFO|$V|" dist/outpost-$V/bin/outpost-linux-amd64 >/dev/null
      - name: Publish release (once per version)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.build.outputs.version }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Release v$V already exists; nothing to publish."
          else
            # Retry a few times: a transient API error (seen once as HTTP 403) must not lose a release.
            for i in 1 2 3; do
              gh release create "v$V" "dist/outpost-$V.zip" dist/outpost-$V/bin/* \
                --target "$GITHUB_SHA" --title "Outpost $V" \
                --notes "Binaries for the Updates tab (unsigned unless noted). Built from $GITHUB_SHA; version stamped at build time." \
                && exit 0
              gh release view "v$V" >/dev/null 2>&1 && exit 0
              sleep $((i * 10))
            done
            exit 1
          fi
