name: Build binaries

# Builds the five platform binaries after every merge to main (and on demand).
# It bumps nothing: the version is whatever `Version` in proto.go says.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One build at a time per branch, so two quick merges cannot race to create the same release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install llvm (for Windows version info)
        run: sudo apt-get update && sudo apt-get install -y llvm
      - name: Vet and test
        run: go vet ./... && go test ./...
      - name: Build
        id: build
        run: |
          V=$(sed -n 's/^const Version = "\(.*\)"/\1/p' proto.go)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          sh build.sh "$PWD/dist/outpost-$V"
          cp README.md "dist/outpost-$V/"
          (cd dist && zip -qr "outpost-$V.zip" "outpost-$V")
          (cd "dist/outpost-$V/bin" && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v6
        with:
          name: outpost-${{ steps.build.outputs.version }}
          path: dist/outpost-${{ steps.build.outputs.version }}/
      - name: Publish release (once per version)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.build.outputs.version }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Release v$V already exists; artifact only."
          else
            # Retry a few times: a transient API error (seen once as HTTP 403) must not lose a release.
            for i in 1 2 3; do
              gh release create "v$V" "dist/outpost-$V.zip" dist/outpost-$V/bin/* \
                --target "$GITHUB_SHA" --title "Outpost $V" \
                --notes "Binaries for the Updates tab (unsigned unless noted). Built from $GITHUB_SHA." && exit 0
              gh release view "v$V" >/dev/null 2>&1 && exit 0
              sleep $((i * 10))
            done
            exit 1
          fi
