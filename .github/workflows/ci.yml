name: CI

# Checks every pull request before it can break main. The release build and
# publishing stay in build.yml, which runs on push to main.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Go vet
        run: go vet ./...
      - name: Go test
        run: go test ./...
      - name: Cross-build all platforms
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            echo "build $t"
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null .
          done
      - name: JavaScript syntax check
        run: |
          for f in web/*.js; do
            echo "check $f"
            node --check "$f"
          done
