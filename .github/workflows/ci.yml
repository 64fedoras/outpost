name: CI

# Checks every pull request before it can break main. The release build and
# publishing stay in build.yml, which runs on push to main.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Vet, unit tests, JavaScript syntax, cross-build
        run: sh testing/run_all.sh fast

  race:
    # The race detector needs cgo; the runner has gcc. Catches data races the plain tests miss.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Go test with the race detector
        run: sh testing/run_all.sh race

  vulncheck:
    # Reports known vulnerabilities in the Go standard library and the vendored modules
    # that Outpost actually calls. Informational for now: a new advisory against the Go
    # version in go.mod must not block unrelated pull requests. Read its log on each PR.
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
