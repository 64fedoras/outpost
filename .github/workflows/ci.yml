name: CI

# Checks every pull request before it can break main. The release build and
# publishing stay in build.yml, which runs on push to main.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Go vet
        run: go vet ./...
      - name: Go test
        run: go test ./...
      - name: Cross-build all platforms
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            echo "build $t"
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null .
          done
      - name: JavaScript syntax check
        run: |
          for f in web/*.js; do
            echo "check $f"
            node --check "$f"
          done
