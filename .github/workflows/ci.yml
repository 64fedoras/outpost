name: CI

# Checks every pull request before it can break main, and every direct push to
# main or dev: a push without a pull request would otherwise skip the race
# detector and the cross-build. The release build and publishing stay in
# build.yml, which runs on push to main.
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Vet, unit tests, JavaScript syntax, cross-build
        run: sh testing/run_all.sh fast

  race:
    # The race detector needs cgo; the runner has gcc. Catches data races the plain tests miss.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Go test with the race detector
        run: sh testing/run_all.sh race

  vulncheck:
    # Reports known vulnerabilities in the Go standard library and the vendored modules
    # that Outpost actually calls. Informational for now: a new advisory against the Go
    # version in go.mod must not block unrelated pull requests. Read its log on each PR.
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
