name: Soak

# Nightly: the e2e rig (real controller and node, stub Claude, fake llama-server)
# runs a batch of tasks while the node and the controller are killed and
# restarted at random. Every task must still finish.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      tasks:
        description: Number of tasks
        default: "12"

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Start the e2e rig
        run: sh testing/e2e/run.sh up
      - name: Soak
        env:
          SOAK_TASKS: ${{ github.event.inputs.tasks || '12' }}
          SOAK_SEED: ${{ github.run_number }}
        run: python3 testing/e2e/soak.py
      - name: Logs
        if: always()
        run: |
          tail -n 200 testing/e2e/run/ctl.log || true
          tail -n 200 testing/e2e/run/node.log || true
      - name: Stop the rig
        if: always()
        run: sh testing/e2e/run.sh down
